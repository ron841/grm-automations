[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grm-browser"
version = "0.1.0"
description = "Browser automation toolkit for GRM prospect-site verification"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "Pillow>=10.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
grm-browser = "grm_browser.cli:main"
